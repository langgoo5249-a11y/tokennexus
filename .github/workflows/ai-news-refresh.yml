name: Refresh AI News

# 每 3 小时抓取一次中英文 AI 新闻，更新 data/ai-news.json 后自动部署。
#
# 为什么自己部署而不依赖 deploy.yml：
#   GitHub Actions 用内置 GITHUB_TOKEN 产生的 push 事件不会触发其他 workflow，
#   所以这里 push 完必须自己跑一次 wrangler 部署，否则线上不会更新。

on:
  schedule:
    # UTC 每 3 小时整点。北京时间 = UTC+8
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch AI news
        run: node scripts/fetch-ai-news.mjs

      - name: Commit data
        id: commit
        run: |
          if git diff --quiet -- data/ai-news.json; then
            echo "新闻数据无变化，跳过部署"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-news.json
          git commit -m "chore(news): 自动刷新 AI 新闻与排行榜（$(date -u '+%Y-%m-%d %H:%M UTC')）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name=tokennexus --branch=main --commit-dirty=true

      - name: Notify IndexNow (homepage)
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs --changed-files index.html
