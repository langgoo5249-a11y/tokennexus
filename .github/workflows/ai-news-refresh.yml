name: Refresh AI News

# 每 3 小时抓取一次中英文 AI 新闻，更新 data/ai-news.json 后提交推送。
#
# 部署方式：本仓库的 Cloudflare Pages 项目绑定了 GitHub 仓库，
# push 到 main 后 Cloudflare 自动构建，因此这里不需要再跑 wrangler
# （deploy.yml 的 wrangler 步骤依赖未配置的 CLOUDFLARE_API_TOKEN，长期失败，勿效仿）。

on:
  schedule:
    # UTC 每 3 小时整点。北京时间 = UTC+8
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch AI news
        run: node scripts/fetch-ai-news.mjs

      - name: Commit data
        id: commit
        run: |
          if git diff --quiet -- data/ai-news.json; then
            echo "新闻数据无变化，跳过部署"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-news.json
          git commit -m "chore(news): 自动刷新 AI 新闻与排行榜（$(date -u '+%Y-%m-%d %H:%M UTC')）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        run: echo "已 push 到 main，Cloudflare Pages 会自动构建部署"

      - name: Notify IndexNow (homepage)
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs --changed-files index.html
