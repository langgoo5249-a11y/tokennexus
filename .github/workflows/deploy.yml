name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史: 脚本用 git diff 算出本次真正变更的页面,
          # 浅克隆(默认 depth:1)下 HEAD~1 不存在, 会退化成全量提交
          fetch-depth: 0

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: tokennexus
          directory: .
          branch: main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # ── 通知搜索引擎: 本次发布的 URL 新增 / 修改 / 删除 ──
      # 本站是静态 HTML 站, 仓库内容即线上产物, 因此直接用 git diff
      # 把变更文件映射成 URL — 比 diff sitemap 更精确, 且天然覆盖
      # 删除(删掉的文件也会出现在 diff 里)。
      #
      # 2026-10-14 替换原先的内联 shell 版。原版三个问题:
      #   1) `git diff HEAD~1 HEAD` 在浅克隆/首推时直接报错
      #      (原文件既没设 fetch-depth, 也没处理首推)
      #   2) 只处理新增/修改, 删除的页面从不通知, 搜索引擎继续抓 404
      #   3) URL 拼接用 shell 字符串, 带空格或特殊字符即坏
      - name: Notify IndexNow (incremental added modified removed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            mapfile -t CHANGED < <(git diff --name-only --diff-filter=ACMRT HEAD~1 HEAD)
          else
            echo "首次提交(无 HEAD~1), 提交全部页面"
            mapfile -t CHANGED < <(git ls-files '*.html' 'robots.txt' 'sitemap*.xml' 'llms*.txt' 'rss.xml')
          fi
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "无变更文件, 跳过 IndexNow 提交"
            exit 0
          fi
          echo "变更文件 ${#CHANGED[@]} 个:"
          printf '  %s\n' "${CHANGED[@]}"
          node scripts/indexnow-submit.mjs --changed-files "${CHANGED[@]}"
        continue-on-error: true
